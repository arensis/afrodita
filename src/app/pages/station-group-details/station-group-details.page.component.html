<div class="content">
  <h2 *ngIf="!!stationGroup?.location">{{stationGroup.location.city}}</h2>
  <p>Selecciona la estación para más detalles:</p>

  <div class="card-grid">
    <div class="station-item" *ngFor="let station of stations; let i=index; trackBy: trackBy">
      <span class="operational-badge" [class.down]="!station.operational">
        {{ station.operational ? 'Operativa' : 'Caída' }}
      </span>
      <arm-station-card
        [station]="station"
        [routerLink]="['/station-details', station.id]"
      ></arm-station-card>
    </div>
  </div>
</div>
