<div class="content">
  <h2 *ngIf="!!stationGroup?.location">{{stationGroup.location.city}}</h2>
  <p>Selecciona la estación para más detalles:</p>

  <div class="card-grid">
    <arm-station-card
      *ngFor="let station of stations; let i=index; trackBy: trackBy"
      [station]="station"
      [routerLink]="['/station-details', station.id]"
    ></arm-station-card>
  </div>
</div>
